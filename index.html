<!doctype html>
<html lang="fa" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=540, height=960" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #090909;
        --ink: #ffffff;
        --accent: #e21b2d;
        --font-display: Tahoma, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 540px;
        height: 960px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 90px;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 76px;
        font-weight: 700;
        text-shadow: 0 0 28px rgba(226,27,45,0.25);
        letter-spacing: -0.03em;
      }
    
      #title::before {
        content: "";
        display: block;
        width: 140px;
        height: 10px;
        background: var(--accent);
        margin: 0 auto 42px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-txxr"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="540"
      data-height="960"
    >
      <h1 data-hf-id="hf-v7pl" id="title" class="clip" data-start="0" data-duration="10" data-track-index="0">تحویل سایپا؛ سؤال اصلی چیست؟</h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title",
        { opacity: 0, y: 250, scale: 0.85, filter: "blur(12px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.5, ease: "power3.out" },
        0.3
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
